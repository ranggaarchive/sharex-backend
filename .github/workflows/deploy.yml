name: Deploy ShareX Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Port is optional, defaults to 22. If your SSH runs on a different port, set it below:
          # port: ${{ secrets.VPS_PORT }}
          script: |
            # Navigate to the backend directory on your VPS
            cd ${{ secrets.VPS_TARGET_DIR }}
            
            # Pull the latest changes from master
            git pull origin master
            
            # Optional: install dependencies if package.json changed
            # npm install
            
            # Stop the app using PM2
            pm2 stop sharex || true
            
            # Start/Restart the app using PM2
            pm2 start sharex
